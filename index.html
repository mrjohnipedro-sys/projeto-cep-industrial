<!-- SECÇÃO DE IMPORTAÇÃO DE EXCEL -->
<div class="card" style="border: 1px dashed #007bff; background: #f0f7ff; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
    <h3 style="margin-top:0; color:#0056b3;">Importar Parâmetros via Excel (.xlsx / .xlsm)</h3>
    <form id="form-importar-excel" style="display: flex; gap: 10px; align-items: center;">
        <input type="file" id="excelFile" accept=".xlsx, .xlsm" required style="background: white; padding: 5px;">
        <button type="submit" style="background-color: #0056b3; color: white; padding: 8px 15px; border: none; font-weight: bold; cursor: pointer; border-radius: 4px;">
            Sincronizar Bases
        </button>
    </form>
    <div id="status-importacao" style="margin-top: 8px; font-weight: bold; font-size: 12px; display: none;"></div>
</div>

<script>
    document.getElementById('form-importar-excel').addEventListener('submit', function(e) {
        e.preventDefault();
        const fileInput = document.getElementById('excelFile');
        if (fileInput.files.length === 0) return;

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        const statusBox = document.getElementById('status-importacao');
        statusBox.style.display = 'block';
        statusBox.style.color = '#0056b3';
        statusBox.innerText = 'A processar e validar abas do ficheiro Excel...';

        fetch(`${API_URL}/Cep/importar-excel`, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            statusBox.style.color = 'green';
            statusBox.innerText = `${data.message} (${data.arquivo} em ${data.dataImportacao})`;
            fileInput.value = '';
        })
        .catch(() => {
            statusBox.style.color = 'red';
            statusBox.innerText = 'Erro ao processar o ficheiro Excel.';
        });
    });
</script>
